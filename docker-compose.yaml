services:
  backend:
    build:
      context: 
        ./backend
    env_file:
      ./backend/.env
    environment:
      DYNAMODB_JOBS_TABLE: Jobs
      SCRAPER_USER_AGENT: JobFinderBot/0.1
      AWS_REGION: eu-south-1
      
    ports:
      - "8000:8000"

  frontend:
    build:
      context:
        ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
