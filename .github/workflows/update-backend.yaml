name: Update Lambda

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/update-backend.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package Lambda
        run: |
          pip install -r backend/requirements.txt -t package
          cp backend/main.py package/main.py
          cp -R backend/api package/api
          cd package
          zip -q -r ../lambda.zip .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-south-1

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name JobFinder-fastapi \
            --zip-file fileb://lambda.zip
